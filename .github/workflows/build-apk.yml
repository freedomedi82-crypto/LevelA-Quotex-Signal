name: Build Level A APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  LEVELA_KEYSTORE_PATH: ${{ github.workspace }}/levela-release.jks
  LEVELA_KEYSTORE_PASSWORD: ${{ secrets.LEVELA_KEYSTORE_PASSWORD }}
  LEVELA_KEY_ALIAS: ${{ secrets.LEVELA_KEY_ALIAS }}
  LEVELA_KEY_PASSWORD: ${{ secrets.LEVELA_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Validate application identity and release version
        run: |
          grep -q 'applicationId = "com.levela.quotexsignal"' app/build.gradle.kts
          grep -q 'versionCode = 2' app/build.gradle.kts
          grep -q 'versionName = "0.2.0"' app/build.gradle.kts
          echo "Application identity and release version checks passed."

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: level-a-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Check release signing configuration
        id: release_config
        env:
          LEVELA_KEYSTORE_BASE64: ${{ secrets.LEVELA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LEVELA_KEYSTORE_BASE64" ] && [ -n "$LEVELA_KEYSTORE_PASSWORD" ] && [ -n "$LEVELA_KEY_ALIAS" ] && [ -n "$LEVELA_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Stable release signing secrets are not configured yet; debug build remains available for validation."
          fi

      - name: Restore release keystore
        if: steps.release_config.outputs.configured == 'true'
        env:
          LEVELA_KEYSTORE_BASE64: ${{ secrets.LEVELA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$LEVELA_KEYSTORE_BASE64" | base64 --decode > "$LEVELA_KEYSTORE_PATH"
          test -s "$LEVELA_KEYSTORE_PATH"

      - name: Verify release certificate fingerprint
        if: steps.release_config.outputs.configured == 'true'
        run: |
          echo "Release signing certificate SHA-256 fingerprint:"
          keytool -list -v -keystore "$LEVELA_KEYSTORE_PATH" -storepass "$LEVELA_KEYSTORE_PASSWORD" -alias "$LEVELA_KEY_ALIAS" | grep -E '^\s*SHA256:'

      - name: Build signed release APK
        if: steps.release_config.outputs.configured == 'true'
        run: gradle assembleRelease --stacktrace

      - name: Verify release APK certificate fingerprint
        if: steps.release_config.outputs.configured == 'true'
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "Signed release APK certificate SHA-256 fingerprint:"
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify --print-certs "$APK" | grep -E 'Signer #1 certificate SHA-256 digest:'

      - name: Upload release APK
        if: steps.release_config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: level-a-release-apk
          path: app/build/outputs/apk/release/*.apk
