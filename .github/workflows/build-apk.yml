name: Build Level A APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  LEVELA_KEYSTORE_PATH: ${{ github.workspace }}/levela-release.jks
  LEVELA_KEYSTORE_PASSWORD: ${{ secrets.LEVELA_KEYSTORE_PASSWORD }}
  LEVELA_KEY_ALIAS: ${{ secrets.LEVELA_KEY_ALIAS }}
  LEVELA_KEY_PASSWORD: ${{ secrets.LEVELA_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore release keystore
        env:
          LEVELA_KEYSTORE_BASE64: ${{ secrets.LEVELA_KEYSTORE_BASE64 }}
        run: |
          test -n "$LEVELA_KEYSTORE_BASE64" || (echo "Missing LEVELA_KEYSTORE_BASE64 repository secret" && exit 1)
          printf '%s' "$LEVELA_KEYSTORE_BASE64" | base64 --decode > "$LEVELA_KEYSTORE_PATH"
          test -s "$LEVELA_KEYSTORE_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: level-a-release-apk
          path: app/build/outputs/apk/release/*.apk
